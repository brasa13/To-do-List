<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Organize seu dia</p>
      <h1>To-Do List</h1>
    </header>

    <div class="todo-container">
      <div class="input-container">
        <input type="text" id="taskInput" placeholder="Adicione uma nova tarefa...">
        <button class="add-btn" id="addTask" aria-label="Adicionar tarefa">+</button>

        <select id="filter" aria-label="Filtrar tarefas">
          <option value="todos">Todos</option>
          <option value="concluidos">Concluídos</option>
        </select>
      </div>

      <ul id="taskList"></ul>

      <div class="paginacao">
        <button id="PrevPage" aria-label="Página anterior">⏪</button>
        <span id="PageInfo"></span>
        <button id="NextPage" aria-label="Próxima página">⏩</button>
      </div>
    </div>
  </main>
</body>
</html>
